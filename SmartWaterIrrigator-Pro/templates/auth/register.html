{% extends "base.html" %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glassmorphism p-5 rounded-4 shadow-lg">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-user-plus fa-3x text-success mb-3"></i>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted small">Join Smart Irrigator and optimize your farming.</p>
                </div>
                
                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label text-muted small fw-semibold">Full Name</label>
                        <input type="text" class="form-control custom-input" id="name" name="name" required placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
                        <input type="email" class="form-control custom-input" id="email" name="email" required placeholder="name@example.com">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small fw-semibold">Password</label>
                        <input type="password" class="form-control custom-input" id="password" name="password" required placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold shadow">Register</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">Already have an account? <a href="{{ url_for('login') }}" class="text-success text-decoration-none fw-semibold">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
