{% extends "base.html" %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center mb-5">
            <h2 class="fw-bold display-5">Get in Touch</h2>
            <p class="text-muted">Have questions about smart farming? We're here to help.</p>
        </div>
    </div>

    <div class="row g-5">
        <div class="col-md-6">
            <div class="glassmorphism p-5 rounded-4 h-100">
                <form action="{{ url_for('contact') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label text-muted small fw-semibold">Full Name</label>
                        <input type="text" class="form-control custom-input" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
                        <input type="email" class="form-control custom-input" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label text-muted small fw-semibold">Subject</label>
                        <input type="text" class="form-control custom-input" id="subject" name="subject" required>
                    </div>
                    <div class="mb-4">
                        <label for="message" class="form-label text-muted small fw-semibold">Message</label>
                        <textarea class="form-control custom-input" id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success rounded-pill px-5 py-2 fw-bold shadow">Send Message <i class="fa-solid fa-paper-plane ms-2"></i></button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="d-flex flex-column gap-4 h-100 justify-content-center px-4">
                <div class="d-flex align-items-start gap-4">
                    <div class="bg-success bg-opacity-10 p-3 rounded-circle text-success">
                        <i class="fa-solid fa-location-dot fa-xl"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1">Our Location</h5>
                        <p class="text-muted">Government Engineering College<br>Modasa, Gujarat</p>
                    </div>
                </div>
                <div class="d-flex align-items-start gap-4">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary">
                        <i class="fa-solid fa-envelope fa-xl"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1">Email Us</h5>
                        <p class="text-muted">support@smartirrigator.com</p>
                    </div>
                </div>
                <div class="d-flex align-items-start gap-4">
                    <div class="bg-warning bg-opacity-10 p-3 rounded-circle text-warning">
                        <i class="fa-solid fa-phone fa-xl"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1">Call Us</h5>
                        <p class="text-muted">+91 98765 43210</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
